spring:
  application:
    name: pedido-ms

  datasource:
    url: jdbc:postgresql://localhost:5432/pedido_db
    username: root
    password: root
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

server:
  port: 8081
